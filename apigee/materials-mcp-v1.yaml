# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: materials-mcp-v1
displayName: Materials MCP API v1
type: proxy
description: MCP proxy for the Materials domain on Sample Business Service
categories:
  - materials
  - mcp
parameters:
  - name: CLOUD_RUN_URL
    displayName: Cloud Run Deployment URL
    description: Base URL of the Cloud Run service (e.g. https://sample-business-services-xyz.a.run.app)
    default: https://sample-business-services.example.run.app
endpoints:
  - name: default
    basePath: /v1/mcp/materials
    routes:
      - name: default
        target: default
    # Disabled for now; re-enable API key validation later
    # flows:
    #   - name: PreFlow
    #     mode: Request
    #     steps:
    #       - name: Verify-API-Key
targets:
  - name: default
    httpTargetConnection:
      URL: "{CLOUD_RUN_URL}/mcp"
      Authentication:
        GoogleIDToken:
          Audience: "{CLOUD_RUN_URL}"
          IncludeEmail: true
policies:
  - name: Verify-API-Key
    type: VerifyAPIKey
    content:
      VerifyAPIKey:
        metadata:
          name: Verify-API-Key
        APIKey:
          metadata:
            ref: request.header.x-api-key
